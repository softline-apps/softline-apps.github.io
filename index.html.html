<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softline Apps</title>
<style>
  :root{
    --pink:#E91E63;
    --bg:#FAF1F5;
    --card:#ffffff;
    --text:#1c1418;
    --muted:#6b5560;
    --border:#eddde5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;
    padding:24px 16px 64px;
  }
  .wrap{max-width:680px;margin:0 auto}
  header{text-align:center;margin-bottom:48px;padding-top:32px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:15px;margin-top:8px}
  .apps{display:flex;flex-direction:column;gap:16px}
  .app-card{
    background:var(--card);border-radius:18px;padding:22px;
    border:1px solid var(--border);
    display:flex;align-items:center;gap:16px;
  }
  .app-icon{
    width:60px;height:60px;border-radius:14px;
    background:var(--pink);display:flex;align-items:center;
    justify-content:center;flex-shrink:0;
    font-size:28px;
  }
  .app-info h2{font-size:17px;font-weight:700;margin-bottom:4px}
  .app-info p{font-size:14px;color:var(--muted)}
  .badge{
    display:inline-block;margin-top:10px;
    background:var(--pink);color:#fff;
    padding:6px 14px;border-radius:20px;
    font-size:12px;font-weight:600;text-decoration:none;
  }
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:48px}
  a{color:var(--pink)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Softline Apps</h1>
    <p class="sub">Simple, private apps for everyday life.</p>
  </header>

  <div class="apps">
    <div class="app-card">
      <div class="app-icon">🌸</div>
      <div class="app-info">
        <h2>Track Yourself</h2>
        <p>Menstrual cycle tracker. No account, no server — your data stays on your device.</p>
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.trackyourself.app">Google Play</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© Softline Apps · <a href="mailto:trackyourself.support@gmail.com">trackyourself.support@gmail.com</a></p>
    <p style="margin-top:8px"><a href="https://track-yourself.github.io/track-yourself-privacy/">Privacy Policy — Track Yourself</a></p>
  </footer>

</div>
</body>
</html>
